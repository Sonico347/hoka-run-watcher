name: Surveillance runs HOKA Paris

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch: {}       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write             # pour enregistrer state/state.json dans le dépôt

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Récupérer le compteur de blocages
        uses: actions/cache/restore@v4
        with:
          path: runtime/
          key: runtime-${{ github.run_id }}
          restore-keys: runtime-

      - name: Vérifier la page
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          EVENT_URL_PATTERN: ${{ vars.EVENT_URL_PATTERN }}
        run: python watch.py

      - name: Sauvegarder le compteur de blocages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime/
          key: runtime-${{ github.run_id }}

      - name: Enregistrer l'état si changement
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Mise à jour des runs vus"
            git pull --rebase
            git push
          fi

      - name: Garder la page téléchargée (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 3
